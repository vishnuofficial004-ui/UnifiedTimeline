<!DOCTYPE html>
<html>
<head>
  <title>Vision AI Unified Timeline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #6ca03bff;
    }
    h2 {
      text-align: center;
    }
    #timeline {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      padding: 10px;
      height: 500px;
      overflow-y: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .event {
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 5px;
      color: #fff;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .PERSON_DETECTED { background-color: #007bff; }
    .DWELL_UPDATE { background-color: #28a745; }
    .ENGAGEMENT { background-color: #ffc107; color: #000; }
    .HANDOFF { background-color: #dc3545; }
  </style>
</head>
<body>
<h2>Live Vision AI Unified Timeline</h2>
<div id="timeline"></div>
<script>
  const timeline = document.getElementById("timeline");
  const socket = new WebSocket("ws://127.0.0.1:8000/ws");
  const renderedEvents = {}; // track rendered DOM nodes by event_id

  socket.onopen = () => {
    console.log("WebSocket connected");
  };
  socket.onerror = (err) => {
    console.error("WebSocket error:", err);
  };

  socket.onmessage = (event) => {
    const e = JSON.parse(event.data);
    const timestamp = e.timestamp || "N/A";
    const camera = e.camera_id || "N/A";
    const person = e.person_id || "N/A";
    const type = e.event_type || "UNKNOWN";
    const dwell = e.details?.dwell_time || 0;
    const mergedCount = e.details?.merged_count || 1;

    // NEW: immediately ack receipt so the server can measure true round-trip latency
    if (e.event_id && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "ack", event_id: e.event_id }));
    }

    if (e.message_type === "UPDATE" && renderedEvents[e.event_id]) {
      const div = renderedEvents[e.event_id];
      div.querySelector(".dwell-span").innerText = `Dwell: ${dwell}s (x${mergedCount})`;
      return;
    }

    const div = document.createElement("div");
    div.className = `event ${type}`;
    div.dataset.eventId = e.event_id;
    div.innerHTML = `
      <span>${timestamp} — ${type} (Camera: ${camera}) [Person: ${person}]</span>
      <span class="dwell-span">Dwell: ${dwell}s (x${mergedCount})</span>
    `;
    timeline.prepend(div);
    renderedEvents[e.event_id] = div;

    if (timeline.childNodes.length > 50) {
      const removed = timeline.lastChild;
      timeline.removeChild(removed);
      delete renderedEvents[removed.dataset.eventId];
    }
  };
</script>
</body>
</html>
